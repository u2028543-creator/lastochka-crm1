                <button data-del-photo="${p.id}" style="position:absolute;top:5px;right:5px;background:var(--danger);color:#fff;border:none;width:24px;height:24px;cursor:pointer;border-radius:50%;">×</button>
            </div>`).join('');
        return `<div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
                <h3>Фотогалерея</h3>
                <button class="btn btn-primary" id="uploadPhotoBtn">➕ Загрузить</button>
            </div>
            <div style="margin-bottom:15px;">
                <b style="font-size:11px;">Альбомы:</b> ${albums.map(a=>`<span class="badge" style="margin:2px;">${a}</span>`).join(' ') || 'Нет альбомов'}
            </div>
            <div class="photo-grid">${photosHtml || '<p style="color:var(--text2);">Нет фотографий</p>'}</div>
        </div>`;
    },

    chat() {
        const onlineUsers = Chat.getOnlineUsers();
        const allUsers = DB.data.users.filter(u => u.id !== App.user.id);
        const privateChatsList = allUsers.map(u => {
            const roleIcon = ROLES[u.role]?.icon || '';
            const avatarHtml = u.avatar ? `<img src="${u.avatar}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">` : `<div style="width:40px;height:40px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;">${u.name[0]}</div>`;
            return `<div class="user-picker-item" data-private-chat-user="${u.id}">
                ${avatarHtml}
                <div style="flex:1;">
                    <div style="font-weight:600;font-size:13px;">${u.name}</div>
                    <div style="font-size:10px;color:var(--text2);">${roleIcon} ${ROLES[u.role]?.name||u.role}</div>
                </div>
            </div>`;
        }).join('');
        return `<div class="chat-container">
            <div class="chat-tabs">
                <div class="chat-tab ${Chat.currentChatType==='general'?'active':''}" id="chatTabGeneral">💬 Общий чат</div>
                <div class="chat-tab ${Chat.currentChatType!=='general'?'active':''}" id="chatTabPrivate">👤 Личные сообщения</div>
            </div>
            <div id="chatPrivatePanel" style="display:${Chat.currentChatType!=='general'?'block':'none'};margin-bottom:10px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <b style="font-size:11px;">Выберите собеседника:</b>
                    ${Chat.currentPrivatePartner ? `<button class="btn btn-sm" id="backToGeneralBtn">← К общему чату</button>` : ''}
                </div>
                <div class="user-picker" style="max-height:150px;">${privateChatsList}</div>
            </div>
            <div class="chat-header">
                <div>
                    <h3 style="margin:0;font-weight:600;font-size:14px;">
                        ${Chat.currentChatType==='general' ? '💬 Общий чат' : '👤 Личный чат'}
                    </h3>
                    <small style="opacity:0.7;font-size:10px;">
                        ${Chat.currentChatType==='general' ? 'Для всех сотрудников' : `Собеседник: ${DB.data.users.find(u=>u.id===Chat.currentPrivatePartner)?.name||''}`}
                    </small>
                </div>
                <div style="display:flex;gap:8px;align-items:center;font-size:11px;flex-wrap:wrap;">
                    <span class="online-dot"></span>
                    <span id="onlineUsersList">${onlineUsers.map(u => `<span class="online-user-item">${u.name.split(' ')[0]}</span>`).join('') || '—'}</span>
                </div>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Введите сообщение..." autocomplete="off">
                <button class="btn btn-primary" id="sendChatBtn">📤 Отправить</button>
                <button class="btn" id="clearChatBtn" title="Очистить">🗑️</button>
            </div>
        </div>`;
    },

    inventory() {
        const rows = (DB.data.inventory||[]).map(i => `<tr>
            <td>${i.name}</td><td>${i.category}</td>
            <td>${i.quantity}</td><td>${i.location||''}</td>
            <td>
                <button class="btn btn-sm" data-edit-inv="${i.id}">✏️</button>
                <button class="btn btn-sm btn-danger" data-del-inv="${i.id}">✕</button>
            </td>
        </tr>`).join('');
        return `<div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
                <h3>Инвентарь</h3>
                <button class="btn btn-primary" id="addInvBtn">➕ Добавить</button>
            </div>
            <table><thead><tr><th>Название</th><th>Категория</th><th>Количество</th><th>Расположение</th><th>Действия</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--text2);">Нет записей</td></tr>'}</tbody></table>
        </div>`;
    },

    quests() {
        const rows = (DB.data.quests||[]).map(q => `<tr>
            <td>${q.name}</td><td>${q.date}</td>
            <td>⭐ ${q.points}</td><td>${q.completed||0}</td>
            <td>
                <button class="btn btn-sm" data-edit-quest="${q.id}">✏️</button>
                <button class="btn btn-sm btn-danger" data-del-quest="${q.id}">✕</button>
            </td>
        </tr>`).join('');
        return `<div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
                <h3>Квесты</h3>
                <button class="btn btn-primary" id="addQuestBtn">➕ Создать</button>
            </div>
            <table><thead><tr><th>Название</th><th>Дата</th><th>Баллы</th><th>Выполнили</th><th>Действия</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--text2);">Нет квестов</td></tr>'}</tbody></table>
        </div>`;
    },

    workSchedule() {
        const now = new Date();
        const year = parseInt(localStorage.getItem('ws_year') || now.getFullYear());
        const month = parseInt(localStorage.getItem('ws_month') || (now.getMonth()+1));
        const daysInMonth = new Date(year, month, 0).getDate();
        const days = Array.from({length: daysInMonth}, (_, i) => i + 1);
        const visibleUsers = Pages._getVisibleUsersForSchedule();
        const dayHeaders = days.map(d => `<th style="min-width:40px;">${d}</th>`).join('');
        const rows = visibleUsers.map(u => {
            const userSched = (DB.data.workSchedule && DB.data.workSchedule[u.id]) || {};
            const cells = days.map(d => {
                const dateKey = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const shift = userSched[dateKey] || '';
                const canEdit = Pages._canEditUserSchedule(u);
                if (canEdit) {
                    return `<td><select data-ws-user="${u.id}" data-ws-date="${dateKey}" class="${shift?'shift-'+shift:''}">
                        <option value="" ${!shift?'selected':''}>—</option>
                        <option value="M" ${shift==='M'?'selected':''}>У</option>
                        <option value="D" ${shift==='D'?'selected':''}>Д</option>
                        <option value="E" ${shift==='E'?'selected':''}>В</option>
                        <option value="N" ${shift==='N'?'selected':''}>Н</option>
                        <option value="OFF" ${shift==='OFF'?'selected':''}>В</option>
                    </select></td>`;
                } else {
                    const cls = shift ? 'shift-'+shift : '';
                    const label = shift==='M'?'У':shift==='D'?'Д':shift==='E'?'В':shift==='N'?'Н':shift==='OFF'?'В':'';
                    return `<td class="${cls}" style="text-align:center;font-weight:600;">${label}</td>`;
                }
            }).join('');
            const avatarHtml = u.avatar ? `<img src="${u.avatar}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:8px;">` : '';
            return `<tr>
                <td style="position:sticky;left:0;background:var(--card);z-index:1;min-width:200px;">
                    <div style="display:flex;align-items:center;">${avatarHtml}<div><b>${u.name}</b><br><small style="color:var(--text2);font-size:10px;">${ROLES[u.role]?.name||u.role}</small></div></div>
                </td>
                ${cells}
            </tr>`;
        }).join('');
        const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        return `<div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px;">
                <h3>График работы</h3>
                <div style="display:flex;gap:5px;align-items:center;">
                    <button class="btn btn-sm" id="wsPrev">←</button>
                    <b style="padding:0 10px;">${monthNames[month-1]} ${year}</b>
                    <button class="btn btn-sm" id="wsNext">→</button>
                    <button class="btn btn-sm btn-primary" id="wsExportExcel">📥 Excel</button>
                </div>
            </div>
            <div style="margin-bottom:10px;font-size:11px;">
                <b>Легенда:</b>
                <span class="badge shift-M" style="margin:0 5px;">У — Утро</span>
                <span class="badge shift-D" style="margin:0 5px;">Д — День</span>
                <span class="badge shift-E" style="margin:0 5px;">В — Вечер</span>
                <span class="badge shift-N" style="margin:0 5px;">Н — Ночь</span>
                <span class="badge shift-OFF" style="margin:0 5px;">В — Выходной</span>
            </div>
            <div style="margin-bottom:10px;padding:10px;background:var(--bg2);border-radius:8px;font-size:11px;border:1px solid var(--border);">
                <b>ℹ️ Права:</b> ${Pages._getSchedulePermissionInfo()}
            </div>
            <div class="schedule-table">
                <table id="workScheduleTable"><thead><tr><th style="position:sticky;left:0;background:var(--gradient);color:#fff;z-index:2;">Сотрудник</th>${dayHeaders}</tr></thead>
                <tbody>${rows || '<tr><td colspan="'+(days.length+1)+'" style="text-align:center;color:var(--text2);">Нет сотрудников</td></tr>'}</tbody></table>
            </div>
        </div>`;
    },
    _getVisibleUsersForSchedule() {
        const role = App.user.role;
        const allUsers = DB.data.users;
        if (role === 'genDirector' || role === 'deputyDirector') return allUsers.filter(u => u.role !== 'dirDirector' && !u.dept);
        if (role === 'dirDirector') return allUsers.filter(u => u.dept === App.user.dept);
        if (role === 'seniorCounselor') return allUsers.filter(u => u.role === 'counselor' || u.role === 'seniorCounselor');
        return allUsers.filter(u => u.id === App.user.id);
    },
    _canEditUserSchedule(targetUser) {
        const role = App.user.role;
        if (targetUser.id === App.user.id) return true;
        if (role === 'genDirector' || role === 'deputyDirector') return targetUser.role !== 'dirDirector' && !targetUser.dept;
        if (role === 'dirDirector') return targetUser.dept === App.user.dept && targetUser.role !== 'dirDirector';
        if (role === 'seniorCounselor') return targetUser.role === 'counselor';
        return false;
    },
    _getSchedulePermissionInfo() {
        const role = App.user.role;
        if (role === 'genDirector' || role === 'deputyDirector') return 'Редактирование графика всего центрального персонала.';
        if (role === 'dirDirector') return 'Редактирование графика сотрудников вашего направления.';
        if (role === 'seniorCounselor') return 'Редактирование графика всех вожатых.';
        return 'Только свой график.';
    },

    reports() {
        const d = DB.data;
        const totalPoints = d.pointsLog.reduce((s,p)=>s+(+p.val||0),0);
        const totalFinance = d.finances.reduce((s,f)=>s+(+f.amount||0),0);
        const paidFinance = d.finances.filter(f=>f.status==='paid').reduce((s,f)=>s+(+f.amount||0),0);
        const debtFinance = d.finances.filter(f=>f.status==='debt').reduce((s,f)=>s+(+f.amount||0),0);
        return `<div class="card">
            <h3>Сводный отчёт</h3>
            <div class="grid-stats">
                <div class="stat-card"><div class="stat-icon">👦</div><div class="stat-val">${d.children.length}</div><div class="stat-lbl">Детей</div></div>
                <div class="stat-card"><div class="stat-icon">💼</div><div class="stat-val">${d.employees.length}</div><div class="stat-lbl">Сотрудников</div></div>
                <div class="stat-card"><div class="stat-icon">🏕️</div><div class="stat-val">${d.shifts.filter(s=>s.status==='active').length}</div><div class="stat-lbl">Смен</div></div>
                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-val">${d.squads.length}</div><div class="stat-lbl">Отрядов</div></div>
                <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-val">${totalPoints}</div><div class="stat-lbl">Баллов</div></div>
                <div class="stat-card"><div class="stat-icon">📜</div><div class="stat-val">${(d.certificates||[]).length}</div><div class="stat-lbl">Сертификатов</div></div>
                <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-val">₽${totalFinance.toLocaleString()}</div><div class="stat-lbl">Выручка</div></div>
                <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-val">₽${paidFinance.toLocaleString()}</div><div class="stat-lbl">Оплачено</div></div>
                <div class="stat-card"><div class="stat-icon">❌</div><div class="stat-val">₽${debtFinance.toLocaleString()}</div><div class="stat-lbl">Долги</div></div>
                <div class="stat-card"><div class="stat-icon">🎉</div><div class="stat-val">${d.events.length}</div><div class="stat-lbl">Мероприятий</div></div>
                <div class="stat-card"><div class="stat-icon">📸</div><div class="stat-val">${(d.photos||[]).length}</div><div class="stat-lbl">Фото</div></div>
            </div>
            <div style="margin-top:20px;display:flex;gap:10px;">
                <button class="btn" id="exportReportBtn">📥 Excel отчёт</button>
                <button class="btn btn-primary" id="exportBackupBtn">💾 Полный бэкап</button>
            </div>
        </div>
        <div class="card">
            <h3>Статистика по направлениям</h3>
            <table id="directionsReportTable"><thead><tr><th>Направление</th><th>Детей</th><th>Сотрудников</th><th>Баллов</th></tr></thead>
            <tbody>${Object.keys(d.directions).map(k => {
                const kids = d.children.filter(c=>c.direction===k);
                const emps = d.employees.filter(e=>e.dept===k);
                const pts = kids.reduce((s,c)=>s+(c.points||0),0);
                return `<tr><td>${UI.dirBadge(k)}</td><td>${kids.length}</td><td>${emps.length}</td><td>⭐ ${pts}</td></tr>`;
            }).join('')}</tbody></table>
            <button class="btn" style="margin-top:10px;" onclick="UI.exportTableToExcel('directionsReportTable','directions_report.xls')">📥 Excel</button>
        </div>`;
    },

    settings() {
        if (App.user.role !== 'genDirector') return '<div class="card">Доступ только у гендиректора</div>';
        return `<div class="card">
            <h3>Настройки</h3>
            <div class="form-row">
                <div><label>Название лагеря</label><input id="set_name" value="${DB.data.settings.campName||'Ласточка'}"></div>
                <div><label>Тема оформления</label>
                    <select id="set_theme">
                        <option value="light" ${DB.data.settings.theme==='light'?'selected':''}>🌞 Светлая</option>
                        <option value="dark" ${DB.data.settings.theme==='dark'?'selected':''}>🌙 Тёмная</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" id="saveSettingsBtn">💾 Сохранить</button>
        </div>
        <div class="card">
            <h3>Управление данными</h3>
            <button class="btn" id="exportBackupBtn2">💾 Скачать бэкап</button>
            <button class="btn" id="importDataBtn">📤 Загрузить бэкап</button>
            <button class="btn btn-danger" id="wipeBtn">🗑️ Полный сброс</button>
        </div>
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
                <h3>Журнал действий (всего: ${(DB.data.logs||[]).length})</h3>
                <div>
                    <button class="btn" id="showFullJournalBtn">📜 Полная история</button>
                    <button class="btn" id="exportJournalBtn">📥 Excel</button>
                </div>
            </div>
            <div class="journal-log">
                ${(DB.data.logs||[]).slice(0,30).map(l => 
                    `<div class="journal-log-item">
                        <span><b>${l.user}</b>: ${l.action}</span>
                        <span style="color:var(--text2);font-size:11px;">${new Date(l.date).toLocaleString('ru-RU')}</span>
                    </div>`
                ).join('') || '<p style="color:var(--text2);">Нет записей</p>'}
            </div>
        </div>`;
    }
};

// ============================================================
// ОБРАБОТЧИКИ
// ============================================================
document.addEventListener('click', (e) => {
    const t = e.target;
    try {
        // Аватар
        if (t.id === 'userProfile' || t.id === 'avatarUploadBtn') {
            App.uploadAvatar();
            return;
        }
        // ЧАТ
        if (t.id === 'sendChatBtn') {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (text) { Chat.sendMessage(text); input.value = ''; input.focus(); }
        }
        if (t.id === 'clearChatBtn') Chat.clearAll();
        if (t.id === 'chatTabGeneral') {
            Chat.switchChat('general');
            document.getElementById('chatTabGeneral').classList.add('active');
            document.getElementById('chatTabPrivate').classList.remove('active');
            document.getElementById('chatPrivatePanel').style.display = 'none';
        }
        if (t.id === 'chatTabPrivate') {
            document.getElementById('chatTabPrivate').classList.add('active');
            document.getElementById('chatTabGeneral').classList.remove('active');
            document.getElementById('chatPrivatePanel').style.display = 'block';
        }
        if (t.dataset.privateChatUser) {
            const userId = +t.dataset.privateChatUser;
            Chat.switchChat('private', userId);
            document.querySelectorAll('[data-private-chat-user]').forEach(el => el.classList.remove('selected'));
            t.classList.add('selected');
            Chat.renderMessages();
        }
        if (t.id === 'backToGeneralBtn') {
            Chat.switchChat('general');
            App.navigate('chat');
        }
        // Удаление
        if (t.dataset.delUser) {
            if (confirm('Удалить аккаунт?')) {
                DB.data.users = DB.data.users.filter(u => u.id !== +t.dataset.delUser);
                DB.log(App.user.name, 'Удаление аккаунта');
                DB.save(); App.navigate('users');
            }
        }
        if (t.dataset.delEmp) {
            if (confirm('Удалить сотрудника?')) {
                DB.data.employees = DB.data.employees.filter(e => e.id !== +t.dataset.delEmp);
                DB.save(); App.navigate('employees');
            }
        }
        if (t.dataset.addXp) {
            const emp = DB.data.employees.find(x => x.id === +t.dataset.addXp);
            if (emp && (emp.xp||0) < 100) {
                emp.xp = (emp.xp||0) + 10;
                DB.save(); UI.toast('+10 XP'); App.navigate('employees');
            }
        }
        if (t.dataset.linkEmp) {
            const empId = +t.dataset.linkEmp;
            const emp = DB.data.employees.find(e => e.id === empId);
            if (!emp) return;
            const availableUsers = DB.data.users.filter(u => !u.employeeId && u.role !== 'genDirector');
            if (!availableUsers.length) { alert('Нет доступных аккаунтов для привязки'); return; }
            UI.pickUser({title: `Привязать аккаунт к "${emp.name}"`, users: availableUsers}, (userId) => {
                if (userId) {
                    const user = DB.data.users.find(u => u.id === userId);
                    user.employeeId = empId;
                    DB.log(App.user.name, `Привязал аккаунт ${user.login} к сотруднику ${emp.name}`);
                    DB.save();
                    UI.toast('Аккаунт привязан');
                    App.navigate('employees');
                }
            });
        }
        if (t.dataset.editEmp) {
            const emp = DB.data.employees.find(x => x.id === +t.dataset.editEmp);
            if (emp) {
                UI.openModal(`
                    <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Редактировать сотрудника</h2>
                    <div class="form-row">
                        <div><label>ФИО</label><input id="emp_name" value="${emp.name}"></div>
                        <div><label>Должность</label><input id="emp_position" value="${emp.position}"></div>
                        <div><label>Телефон</label><input id="emp_phone" value="${emp.phone||''}"></div>
                        <div><label>Дата приёма</label><input type="date" id="emp_hire" value="${emp.hireDate||''}"></div>
                        <div><label>Направление</label>
                            <select id="emp_dept">
                                <option value="">—</option>
                                ${Object.keys(DB.data.directions).map(k=>`<option value="${k}" ${emp.dept===k?'selected':''}>${DB.data.directions[k].name}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="saveEmpBtn">💾 Сохранить</button>
                `);
                document.getElementById('saveEmpBtn').onclick = () => {
                    emp.name = document.getElementById('emp_name').value;
                    emp.position = document.getElementById('emp_position').value;
                    emp.phone = document.getElementById('emp_phone').value;
                    emp.hireDate = document.getElementById('emp_hire').value;
                    emp.dept = document.getElementById('emp_dept').value || null;
                    DB.save(); UI.closeModal(); App.navigate('employees');
                };
            }
        }
        if (t.dataset.delChild) {
            if (confirm('Удалить ребёнка?')) {
                DB.data.children = DB.data.children.filter(c => c.id !== +t.dataset.delChild);
                DB.save(); App.navigate('children');
            }
        }
        if (t.dataset.viewChild) {
            const c = DB.data.children.find(x => x.id === +t.dataset.viewChild);
            if (c) {
                const grades = DB.data.grades.filter(g=>g.childId===c.id);
                const avg = grades.length ? (grades.reduce((s,g)=>s+g.value,0)/grades.length).toFixed(2) : '—';
                UI.openModal(`<h2 style="font-weight:300;letter-spacing:1px;font-size:20px;">${c.name}</h2>
                    ${c.allergy||c.medical ? `<div class="health-warning">
                        <b>⚕ Медицинская информация:</b><br>

        }
        if (t.id === 'exportFinBtn') {
            const rows = [['Дата','Описание','Тип','Сумма','Статус']];

                const c = DB.data.children.find(x=>x.id===f.childId);

        if (t.id === 'addBudgetBtn') {
            UI.openModal(`
                <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Новая статья</h2>
                <label>Название</label>
                <input id="nb_name" placeholder="Питание, Зарплата, Хознужды...">

                <input type="number" id="nb_planned" value="0">

                <button class="btn btn-primary" id="saveBudgetNewBtn">✨ Добавить</button>
            `);
            document.getElementById('saveBudgetNewBtn').onclick = () => {
                const name = document.getElementById('nb_name').value.trim();
                if (!name) return UI.toast('Введите название');
                if (!DB.data.budget.categories) DB.data.budget.categories = {};
                DB.data.budget.categories[name] = {
                    planned: +document.getElementById('nb_planned').value,
                    fact: +document.getElementById('nb_fact').value
                };
                DB.save(); UI.closeModal(); App.navigate('budget');
            };
        }
        if (t.id === 'addMedCardBtn') {
            if (!DB.data.children.length) return UI.toast('Сначала добавьте детей');
            UI.pickChild({title: 'Выберите ребёнка'}, (childId) => {
                if (!childId) return;
                const child = DB.data.children.find(c=>c.id===childId);
                UI.openModal(`
                    <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Медкарта: ${child.name}</h2>
                    <label>Группа здоровья</label>
                    <select id="mc_group">

                    </select>
                    <label>Аллергии</label><input id="mc_allergy">
                    <label>Заболевания</label><input id="mc_disease">
                    <label>Прививки</label><textarea id="mc_vacc" rows="2"></textarea>
                    <button class="btn btn-primary" id="saveMcNewBtn">💾 Сохранить</button>
                `);
                document.getElementById('saveMcNewBtn').onclick = () => {
                    DB.data.medical.cards.push({

                        childName: child.name,

                        allergy: document.getElementById('mc_allergy').value,
                        disease: document.getElementById('mc_disease').value,
                        vaccinations: document.getElementById('mc_vacc').value

                    child.allergy = document.getElementById('mc_allergy').value;
                    child.medical = document.getElementById('mc_disease').value;
                    DB.save(); UI.closeModal(); App.navigate('medical');
                };
            });
        }
        if (t.id === 'addMedBtn') {
            if (!DB.data.children.length) return UI.toast('Сначала добавьте детей');
            UI.pickChild({title: 'Выберите ребёнка'}, (childId) => {
                if (!childId) return;
                const child = DB.data.children.find(c=>c.id===childId);
                UI.openModal(`
                    <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Назначить лекарство: ${child.name}</h2>

                    <button class="btn btn-primary" id="saveNmBtn">💾 Сохранить</button>
                `);

                    const medicine = document.getElementById('nm_med').value;
                    if (!medicine) return UI.toast('Укажите лекарство');
                    DB.data.medical.medicines.push({
                        id: Date.now(),
                        childName: child.name,
                        medicine,
                        dosage: document.getElementById('nm_dose').value,
                        time: document.getElementById('nm_time').value,
                        status: false
                    });
                    DB.save(); UI.closeModal(); App.navigate('medical');
                };

        }
        if (t.id === 'addIncidentBtn') {
            if (!DB.data.children.length) return UI.toast('Сначала добавьте детей');
            UI.pickChild({title: 'Выберите ребёнка'}, (childId) => {
                if (!childId) return;
                const child = DB.data.children.find(c=>c.id===childId);
                UI.openModal(`
                    <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Происшествие: ${child.name}</h2>
                    <label>Дата</label><input type="date" id="ni_date" value="${new Date().toISOString().slice(0,10)}">
                    <label>Описание</label><textarea id="ni_desc" rows="2"></textarea>

                    <label><input type="checkbox" id="ni_notify"> Родители уведомлены</label>
                    <button class="btn btn-primary" id="saveNiBtn">💾 Сохранить</button>
                `);
                document.getElementById('saveNiBtn').onclick = () => {
                    const description = document.getElementById('ni_desc').value;
                    if (!description) return UI.toast('Опишите происшествие');
                    DB.data.medical.incidents.push({
                        id: Date.now(),
                        date: document.getElementById('ni_date').value,
                        childName: child.name,
                        description,
                        measures: document.getElementById('ni_measures').value,
                        parentNotified: document.getElementById('ni_notify').checked
                    });
                    DB.save(); UI.closeModal(); App.navigate('medical');
                };
            });
        }
        if (t.id === 'addEventBtn') {
            UI.openModal(`
                <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Создать мероприятие</h2>
                <div class="form-row">
                    <div><label>Название</label><input id="nev_name"></div>
                    <div><label>Дата</label><input type="date" id="nev_date" value="${new Date().toISOString().slice(0,10)}"></div>
                    <div><label>Время</label><input type="time" id="nev_time"></div>
                    <div><label>Ответственный</label><input id="nev_resp"></div>
                    <div><label>Тип</label>
                        <select id="nev_type">
                            <option>Спортивное</option><option>Творческое</option><option>Развлекательное</option>
                            <option>Образовательное</option><option>Экскурсия</option>
                        </select>
                    </div>
                    <div><label>Участников</label><input type="number" id="nev_part" value="0"></div>
                </div>
                <button class="btn btn-primary" id="saveNevBtn">✨ Создать</button>
            `);
            document.getElementById('saveNevBtn').onclick = () => {
                const name = document.getElementById('nev_name').value.trim();
                if (!name) return UI.toast('Название обязательно');
                DB.data.events.push({
                    id: Date.now(),
                    name,
                    date: document.getElementById('nev_date').value,
                    time: document.getElementById('nev_time').value,
                    responsible: document.getElementById('nev_resp').value,
                    type: document.getElementById('nev_type').value,
                    participants: +document.getElementById('nev_part').value
                });
                DB.save(); UI.closeModal(); App.navigate('events');
            };
        }
        if (t.id === 'uploadPhotoBtn') {
            UI.openModal(`
                <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Загрузить фото</h2>
                <label>Альбом</label><input id="ph_album" value="Общий">
                <label>Подпись</label><input id="ph_caption">
                <label>Файл</label><input type="file" id="ph_file" accept="image/*">
                <button class="btn btn-primary" id="savePhBtn">✨ Загрузить</button>
            `);
            document.getElementById('savePhBtn').onclick = () => {
                const file = document.getElementById('ph_file').files[0];
                if (!file) return UI.toast('Выберите файл');
                const reader = new FileReader();
                reader.onload = ev => {
                    if (!DB.data.photos) DB.data.photos = [];
                    DB.data.photos.push({
                        id: Date.now(),
                        data: ev.target.result,
                        album: document.getElementById('ph_album').value,
                        caption: document.getElementById('ph_caption').value,
                        date: new Date().toLocaleDateString()
                    });
                    DB.save(); UI.closeModal(); UI.toast('Фото загружено'); App.navigate('photos');
                };
                reader.readAsDataURL(file);
            };
        }
        if (t.id === 'addInvBtn') {
            UI.openModal(`
                <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Добавить инвентарь</h2>
                <label>Название</label><input id="ninv_name">
                <label>Категория</label>
                <select id="ninv_cat">
                    <option>Спортинвентарь</option><option>Канцтовары</option><option>Хозтовары</option>
                    <option>Мебель</option><option>Техника</option>
                </select>
                <label>Количество</label><input type="number" id="ninv_qty" value="0">
                <label>Расположение</label><input id="ninv_loc">
                <button class="btn btn-primary" id="saveNinvBtn">✨ Добавить</button>
            `);
            document.getElementById('saveNinvBtn').onclick = () => {
                const name = document.getElementById('ninv_name').value.trim();
                if (!name) return UI.toast('Название обязательно');
                if (!DB.data.inventory) DB.data.inventory = [];
                DB.data.inventory.push({
                    id: Date.now(),
                    name,
                    category: document.getElementById('ninv_cat').value,
                    quantity: +document.getElementById('ninv_qty').value,
                    location: document.getElementById('ninv_loc').value
                });
                DB.save(); UI.closeModal(); App.navigate('inventory');
            };
        }
        if (t.id === 'addQuestBtn') {
            UI.openModal(`
                <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Создать квест</h2>
                <label>Название</label><input id="nq_name">
                <label>Баллы</label><input type="number" id="nq_points" value="10">
                <label>Описание</label><textarea id="nq_desc" rows="2"></textarea>
                <button class="btn btn-primary" id="saveNqBtn">✨ Создать</button>
            `);
            document.getElementById('saveNqBtn').onclick = () => {
                const name = document.getElementById('nq_name').value.trim();
                if (!name) return UI.toast('Название обязательно');
                if (!DB.data.quests) DB.data.quests = [];
                DB.data.quests.push({
                    id: Date.now(),
                    name,
                    date: new Date().toISOString().slice(0,10),
                    points: +document.getElementById('nq_points').value,
                    description: document.getElementById('nq_desc').value,
                    completed: 0
                });
                DB.save(); UI.closeModal(); App.navigate('quests');
            };
        }
        if (t.id === 'wsPrev') {
            const now = new Date();
            let y = parseInt(localStorage.getItem('ws_year') || now.getFullYear());
            let m = parseInt(localStorage.getItem('ws_month') || (now.getMonth()+1));
            m--; if (m < 1) { m = 12; y--; }
            localStorage.setItem('ws_year', y);
            localStorage.setItem('ws_month', m);
            App.navigate('workSchedule');
        }
        if (t.id === 'wsNext') {
            const now = new Date();
            let y = parseInt(localStorage.getItem('ws_year') || now.getFullYear());
            let m = parseInt(localStorage.getItem('ws_month') || (now.getMonth()+1));
            m++; if (m > 12) { m = 1; y++; }
            localStorage.setItem('ws_year', y);
            localStorage.setItem('ws_month', m);
            App.navigate('workSchedule');
        }
        if (t.id === 'wsExportExcel') {
            UI.exportTableToExcel('workScheduleTable', 'work_schedule.xls');
        }
        if (t.id === 'exportReportBtn') {
            const rows = [['Метрика','Значение']];
            rows.push(['Детей', DB.data.children.length]);
            rows.push(['Сотрудников', DB.data.employees.length]);
            rows.push(['Смен', DB.data.shifts.length]);
            rows.push(['Отрядов', DB.data.squads.length]);
            rows.push(['Баллов', DB.data.pointsLog.reduce((s,p)=>s+(+p.val||0),0)]);
            rows.push(['Сертификатов', (DB.data.certificates||[]).length]);
            rows.push(['Выручка', DB.data.finances.reduce((s,f)=>s+(+f.amount||0),0)]);
            UI.exportCSV(rows, 'report.csv');
        }
        if (t.id === 'exportBackupBtn' || t.id === 'exportBackupBtn2') {
            UI.exportJSON(DB.data, 'backup.json');
        }
        if (t.id === 'importDataBtn') {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'application/json';
            input.onchange = e => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        DB.data = JSON.parse(ev.target.result);
                        DB.save(); UI.toast('Данные восстановлены');
                        setTimeout(() => location.reload(), 1000);
                    } catch(err) { alert('Ошибка файла'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        if (t.id === 'wipeBtn') {
            if (confirm('УДАЛИТЬ ВСЕ ДАННЫЕ?')) {
                localStorage.removeItem(DB_KEY);
                localStorage.removeItem(CHAT_KEY);
                localStorage.removeItem(ONLINE_KEY);
                localStorage.removeItem(PRIVATE_CHAT_KEY);
                sessionStorage.removeItem('currentUser');
                location.reload();
            }
        }
        if (t.id === 'saveSettingsBtn') {
            DB.data.settings.campName = document.getElementById('set_name').value;
            DB.data.settings.theme = document.getElementById('set_theme').value;
            DB.save(); UI.toast('Настройки сохранены');
        }
        if (t.id === 'showFullJournalBtn') {
            const logs = DB.data.logs || [];
            UI.openModal(`
                <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">Полная история (${logs.length})</h2>
                <div class="journal-log" style="max-height:60vh;">
                    ${logs.map(l => 
                        `<div class="journal-log-item">
                            <span><b>${l.user}</b>: ${l.action}</span>
                            <span style="color:var(--text2);font-size:11px;">${new Date(l.date).toLocaleString('ru-RU')}</span>
                        </div>`
                    ).join('') || '<p style="color:var(--text2);">Нет записей</p>'}
                </div>
                <button class="btn" style="margin-top:15px;" onclick="UI.closeModal()">Закрыть</button>
            `);
        }
        if (t.id === 'exportJournalBtn') {
            const rows = [['Дата','Пользователь','Действие']];
            (DB.data.logs||[]).forEach(l => rows.push([new Date(l.date).toLocaleString('ru-RU'), l.user, l.action]));
            UI.exportCSV(rows, 'journal.csv');
        }
    } catch (e) {
        console.error('Click handler error:', e);
        UI.toast('Ошибка: ' + e.message);
    }
});

// Change handlers
document.addEventListener('change', (e) => {
    try {
        if (e.target.dataset.wsUser) {
            const userId = +e.target.dataset.wsUser;
            const dateKey = e.target.dataset.wsDate;
            const value = e.target.value;
            if (!DB.data.workSchedule) DB.data.workSchedule = {};
            if (!DB.data.workSchedule[userId]) DB.data.workSchedule[userId] = {};
            if (value) DB.data.workSchedule[userId][dateKey] = value;
            else delete DB.data.workSchedule[userId][dateKey];
            e.target.className = value ? 'shift-'+value : '';
            DB.save();
        }
        if (e.target.dataset.finStatus) {
            const id = +e.target.dataset.finStatus;
            const f = DB.data.finances.find(x => x.id === id);
            if (f) { f.status = e.target.value; DB.save(); UI.toast('Статус обновлён'); }
        }
    } catch (e) { console.error(e); }
});

// Blur handler for schedule
document.addEventListener('blur', (e) => {
    try {
        if (e.target.dataset.scheduleKey) {
            if (!DB.data.schedule) DB.data.schedule = {};
            DB.data.schedule[e.target.dataset.scheduleKey] = e.target.textContent.trim();
            DB.save();
        }
    } catch (e) { console.error(e); }
}, true);

// Enter in chat
document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && e.target.id === 'chatInput') {
        document.getElementById('sendChatBtn').click();
    }
});

// Document upload/download
document.addEventListener('click', (e) => {
    if (e.target.dataset.uploadDoc) {
        const key = e.target.dataset.uploadDoc;
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = ev => {
            const file = ev.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                if (!DB.data.docs[key]) DB.data.docs[key] = [];
                DB.data.docs[key].push({
                    id: Date.now(), name: file.name,
                    date: new Date().toLocaleDateString(),
                    size: (file.size/1024).toFixed(1)+' KB',
                    data: e.target.result
                });
                DB.save(); UI.toast('Файл загружен');
                const folderBtn = document.querySelector(`[data-open-folder="${key}"]`);
                if (folderBtn) folderBtn.click();
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }
    if (e.target.dataset.downloadDoc) {
        const [key, id] = e.target.dataset.downloadDoc.split('|');
        const doc = DB.data.docs[key].find(d => d.id === +id);
        if (doc && doc.data) {
            const a = document.createElement('a');
            a.href = doc.data; a.download = doc.name; a.click();
        }
    }
});

// INIT
window.addEventListener('DOMContentLoaded', () => {
    try {
        document.getElementById('loginBtn').addEventListener('click', () => App.auth());
        document.getElementById('l_pass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') App.auth();
        });
        document.getElementById('resetBtn').addEventListener('click', () => {
            if (confirm('Сбросить все данные?')) {
                localStorage.removeItem(DB_KEY);
                localStorage.removeItem(CHAT_KEY);
                localStorage.removeItem(ONLINE_KEY);
                localStorage.removeItem(PRIVATE_CHAT_KEY);
                sessionStorage.removeItem('currentUser');
                location.reload();
            }
        });
        document.getElementById('logoutBtn').addEventListener('click', () => App.logout());
        document.getElementById('closeModalBtn').addEventListener('click', () => UI.closeModal());
        window.addEventListener('beforeunload', () => Chat.destroy());
        App.init();
    } catch (e) {
        console.error('Init error:', e);
        alert('Ошибка запуска: ' + e.message);
    }
});
</script>
</body>
</html>
