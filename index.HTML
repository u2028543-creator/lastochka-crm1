<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>CRM Ласточка PRO</title>
<style>
:root{
    --bg:#0a0a0f;--bg2:#15151f;--card:#1a1a2e;--card2:#20203a;
    --border:#2d2d4a;--text:#e5e7eb;--text2:#9ca3af;
    --primary:#8b5cf6;--primary2:#a78bfa;--primary-dark:#7c3aed;
    --purple:#6d28d9;--purple-dark:#4c1d95;
    --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
    --gradient:linear-gradient(135deg,#8b5cf6 0%,#6d28d9 100%);
    --gradient2:linear-gradient(135deg,#a78bfa 0%,#7c3aed 100%);
    --gradient-dark:linear-gradient(135deg,#1a1a2e 0%,#0a0a0f 100%);
    --shadow:0 10px 40px rgba(139,92,246,0.15);
    --shadow-lg:0 20px 60px rgba(139,92,246,0.3);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden;
    background-image:radial-gradient(circle at 20% 50%,rgba(139,92,246,0.08) 0%,transparent 50%),
                     radial-gradient(circle at 80% 80%,rgba(124,58,237,0.08) 0%,transparent 50%);}

/* LOGIN */
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.login-box{background:var(--card);padding:50px;border-radius:24px;width:440px;
    border:1px solid var(--border);box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--gradient);}
.login-logo{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;background:var(--gradient);
    display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:var(--shadow);}
.login-box h2{text-align:center;margin-bottom:10px;font-weight:300;letter-spacing:3px;
    background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:28px;}
.login-sub{text-align:center;color:var(--text2);margin-bottom:30px;font-size:13px;letter-spacing:1px;}
.login-box input{width:100%;padding:14px 18px;margin:8px 0;border:1px solid var(--border);
    border-radius:12px;background:var(--bg2);color:var(--text);font-size:14px;transition:0.3s;}
.login-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,0.2);}
.login-box button{width:100%;padding:14px;background:var(--gradient);color:#fff;border:none;
    border-radius:12px;cursor:pointer;font-weight:600;letter-spacing:1px;margin-top:15px;
    font-size:14px;transition:0.3s;box-shadow:var(--shadow);}
.login-box button:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.hint{margin-top:20px;padding:15px;background:var(--bg2);border:1px solid var(--border);
    border-radius:12px;font-size:11px;color:var(--text2);}
.hint code{background:var(--purple-dark);color:var(--primary2);padding:2px 6px;border-radius:4px;}
.err{color:var(--danger);text-align:center;margin-top:10px;font-size:13px;min-height:18px;}
.reset-btn{margin-top:10px;width:100%;padding:10px;background:transparent;color:var(--text2);
    border:1px solid var(--border);cursor:pointer;font-size:11px;border-radius:8px;transition:0.3s;}
.reset-btn:hover{background:var(--bg2);color:var(--text);}

/* APP */
.app-wrap{display:none;height:100vh;}
.app-wrap.active{display:flex;}

/* SIDEBAR */
.sidebar{width:280px;background:var(--card);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;position:relative;}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:200px;
    background:var(--gradient);opacity:0.1;pointer-events:none;}
.sidebar-header{padding:25px 20px;text-align:center;position:relative;z-index:1;}
.sidebar-logo{width:60px;height:60px;margin:0 auto 10px;border-radius:50%;background:var(--gradient);
    display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:var(--shadow);}
.sidebar-title{font-size:16px;font-weight:600;letter-spacing:2px;
    background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sidebar-sub{font-size:10px;color:var(--text2);letter-spacing:2px;margin-top:3px;}

/* USER PROFILE */
.user-profile{padding:20px;margin:0 15px;background:var(--bg2);border-radius:16px;
    display:flex;align-items:center;gap:12px;position:relative;z-index:1;
    border:1px solid var(--border);cursor:pointer;transition:0.3s;}
.user-profile:hover{border-color:var(--primary);transform:translateY(-2px);}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--gradient);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;
    color:#fff;overflow:hidden;flex-shrink:0;position:relative;border:2px solid var(--primary);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-upload{position:absolute;bottom:0;right:0;width:18px;height:18px;background:var(--primary);
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;
    cursor:pointer;border:2px solid var(--card);}
.user-info{flex:1;min-width:0;}
.user-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role{font-size:10px;color:var(--text2);letter-spacing:1px;margin-top:2px;}

/* MENU */
.menu-scroll{flex:1;overflow-y:auto;padding:15px 0;position:relative;z-index:1;}
.menu-scroll::-webkit-scrollbar{width:4px;}
.menu-scroll::-webkit-scrollbar-thumb{background:var(--primary);border-radius:2px;}
.menu-section{padding:10px 20px 5px;font-size:9px;color:var(--text2);
    letter-spacing:2px;text-transform:uppercase;font-weight:600;}
.menu-item{padding:12px 20px;cursor:pointer;color:var(--text2);
    display:flex;align-items:center;gap:12px;font-size:13px;transition:0.2s;
    margin:2px 10px;border-radius:10px;position:relative;}
.menu-item:hover{background:var(--bg2);color:var(--text);}
.menu-item.active{background:var(--gradient);color:#fff;box-shadow:var(--shadow);}
.menu-icon{width:20px;text-align:center;font-size:16px;}
.menu-label{flex:1;}
.menu-badge{background:var(--danger);color:#fff;font-size:9px;padding:2px 6px;
    border-radius:10px;font-weight:600;}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:30px;background:var(--bg);}
.main::-webkit-scrollbar{width:8px;}
.main::-webkit-scrollbar-thumb{background:var(--primary-dark);border-radius:4px;}

.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;
    background:var(--card);padding:20px 25px;border-radius:16px;border:1px solid var(--border);
    box-shadow:var(--shadow);}
.page-title{font-size:24px;font-weight:300;letter-spacing:1px;
    background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-date{font-size:12px;color:var(--text2);letter-spacing:1px;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);padding:25px;margin-bottom:20px;
    border-radius:16px;box-shadow:var(--shadow);transition:0.3s;position:relative;overflow:hidden;}
.card:hover{border-color:var(--primary-dark);}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--gradient);opacity:0;transition:0.3s;}
.card:hover::before{opacity:1;}
.card h3{margin-bottom:20px;font-weight:600;font-size:16px;letter-spacing:0.5px;
    padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.card h3::before{content:'';width:4px;height:20px;background:var(--gradient);border-radius:2px;}

/* STATS */
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px;}
.stat-card{background:var(--card);padding:20px;border-radius:16px;border:1px solid var(--border);
    position:relative;overflow:hidden;transition:0.3s;}
.stat-card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:var(--shadow-lg);}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:100px;height:100px;
    background:var(--gradient);opacity:0.1;border-radius:50%;transform:translate(30%,-30%);}
.stat-icon{font-size:28px;margin-bottom:10px;}
.stat-val{font-size:32px;font-weight:300;background:var(--gradient);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.stat-lbl{font-size:11px;color:var(--text2);letter-spacing:1px;margin-top:5px;}

/* BUTTONS */
.btn{padding:10px 18px;border:1px solid var(--border);background:var(--card);color:var(--text);
    cursor:pointer;font-weight:500;font-size:12px;letter-spacing:0.5px;transition:0.3s;
    display:inline-flex;align-items:center;gap:6px;border-radius:10px;}
.btn:hover{background:var(--bg2);border-color:var(--primary);transform:translateY(-1px);}
.btn-primary{background:var(--gradient);color:#fff;border:none;box-shadow:var(--shadow);}
.btn-primary:hover{box-shadow:var(--shadow-lg);opacity:0.95;}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:none;}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;}
.btn-sm{padding:6px 12px;font-size:11px;}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center;border-radius:50%;}

/* TABLES */
table{width:100%;border-collapse:collapse;}
table th{background:var(--bg2);color:var(--primary2);padding:12px;text-align:left;
    font-size:11px;letter-spacing:1px;font-weight:600;border-bottom:2px solid var(--primary-dark);}
table td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;}
table tr{transition:0.2s;}
table tr:hover{background:var(--bg2);}

/* FORMS */
input,select,textarea{width:100%;padding:10px 14px;border:1px solid var(--border);
    background:var(--bg2);color:var(--text);font-size:13px;margin-bottom:10px;border-radius:10px;transition:0.3s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(139,92,246,0.2);}
label{display:block;font-size:10px;letter-spacing:1px;color:var(--text2);
    margin-bottom:5px;font-weight:600;text-transform:uppercase;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}

/* BADGES */
.badge{display:inline-block;padding:4px 10px;font-size:10px;font-weight:600;
    letter-spacing:0.5px;border-radius:8px;background:var(--bg2);color:var(--primary2);
    border:1px solid var(--border);}
.badge-filled{background:var(--gradient);color:#fff;border:none;}
.badge-health{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;
    animation:pulse 2s infinite;border:none;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.7;}}

/* MODAL */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:1000;
    justify-content:center;align-items:center;padding:20px;}
.modal.active{display:flex;}
.modal-content{background:var(--card);padding:30px;border-radius:20px;max-width:700px;
    width:100%;max-height:90vh;overflow-y:auto;position:relative;
    border:1px solid var(--border);box-shadow:var(--shadow-lg);animation:modalIn 0.3s;}
@keyframes modalIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.close-modal{position:absolute;top:15px;right:20px;font-size:28px;cursor:pointer;
    color:var(--text2);transition:0.3s;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;}
.close-modal:hover{background:var(--bg2);color:var(--text);}

/* TOAST */
.toast{position:fixed;bottom:25px;right:25px;background:var(--gradient);color:#fff;
    padding:14px 24px;border-radius:12px;z-index:2000;opacity:0;transform:translateY(20px);
    transition:0.3s;font-size:13px;box-shadow:var(--shadow-lg);letter-spacing:0.5px;}
.toast.show{opacity:1;transform:translateY(0);}

/* SCHEDULE */
.schedule-table{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
.schedule-table table{min-width:1200px;}
.schedule-table th,.schedule-table td{text-align:center;padding:6px;font-size:11px;min-width:38px;}
.schedule-table td select{padding:3px;font-size:10px;width:100%;margin:0;
    border:1px solid var(--border);background:var(--bg2);color:var(--text);border-radius:6px;}
.shift-M{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;}
.shift-D{background:linear-gradient(135deg,#60a5fa,#3b82f6);color:#fff;}
.shift-E{background:linear-gradient(135deg,#f472b6,#ec4899);color:#fff;}
.shift-N{background:linear-gradient(135deg,#6d28d9,#4c1d95);color:#fff;}
.shift-OFF{background:var(--bg2);color:var(--text2);}

/* FOLDERS */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
.folder{text-align:center;cursor:pointer;padding:20px 10px;border-radius:14px;
    border:1px solid var(--border);background:var(--bg2);transition:0.3s;}
.folder:hover{border-color:var(--primary);background:var(--card);transform:translateY(-3px);box-shadow:var(--shadow);}
.folder-icon{font-size:40px;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(139,92,246,0.3));}

/* PHOTOS */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.photo-item{aspect-ratio:1;background:var(--bg2);border-radius:12px;overflow:hidden;
    position:relative;cursor:pointer;border:1px solid var(--border);transition:0.3s;}
.photo-item:hover{transform:scale(1.03);border-color:var(--primary);box-shadow:var(--shadow);}
.photo-item img{width:100%;height:100%;object-fit:cover;}

/* CHAT */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 180px);}
.chat-tabs{display:flex;gap:5px;margin-bottom:15px;background:var(--card);padding:5px;
    border-radius:12px;border:1px solid var(--border);}
.chat-tab{flex:1;padding:10px;cursor:pointer;border-radius:8px;font-size:12px;
    text-align:center;transition:0.3s;color:var(--text2);}
.chat-tab.active{background:var(--gradient);color:#fff;box-shadow:var(--shadow);}
.chat-header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;
    background:var(--gradient);border-radius:12px 12px 0 0;color:#fff;}
.chat-box{flex:1;overflow-y:auto;border:1px solid var(--border);border-top:none;
    padding:15px;background:var(--bg2);min-height:400px;}
.chat-msg{margin:10px 0;padding:12px 16px;max-width:70%;border-radius:14px;animation:msgIn 0.3s;}
@keyframes msgIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.chat-msg.mine{background:var(--gradient);color:#fff;margin-left:auto;border-bottom-right-radius:4px;}
.chat-msg.other{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;}
.chat-msg .msg-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:10px;opacity:0.8;}
.chat-msg .msg-text{font-size:13px;line-height:1.5;word-wrap:break-word;}
.chat-input-area{display:flex;gap:10px;padding:15px;background:var(--card);
    border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;}
.chat-input-area input{margin:0;flex:1;}
.chat-notification{position:fixed;top:25px;right:25px;background:var(--gradient);color:#fff;
    padding:15px 20px;border-radius:12px;z-index:1500;max-width:300px;cursor:pointer;
    box-shadow:var(--shadow-lg);opacity:0;transform:translateX(100px);transition:0.3s;font-size:12px;}
.chat-notification.show{opacity:1;transform:translateX(0);}
.unread-badge{background:var(--danger);color:#fff;font-size:9px;padding:2px 7px;
    border-radius:10px;font-weight:700;margin-left:5px;}
.online-user-item{display:inline-flex;align-items:center;gap:5px;background:var(--card);
    padding:4px 10px;font-size:10px;margin:2px;border-radius:20px;border:1px solid var(--border);}
.online-dot{width:8px;height:8px;background:var(--success);border-radius:50%;
    animation:pulse 2s infinite;display:inline-block;}

/* USER PICKER */
.user-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:8px;max-height:350px;overflow-y:auto;padding:10px;border:1px solid var(--border);
    border-radius:12px;background:var(--bg2);}
.user-picker-item{padding:12px;border:1px solid var(--border);cursor:pointer;
    background:var(--card);display:flex;align-items:center;gap:12px;border-radius:10px;transition:0.2s;}
.user-picker-item:hover{border-color:var(--primary);background:var(--bg2);}
.user-picker-item.selected{background:var(--gradient);color:#fff;border-color:var(--primary);}

/* CALENDAR */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.calendar-day{aspect-ratio:1;border:1px solid var(--border);padding:6px;font-size:11px;
    cursor:pointer;position:relative;background:var(--card);border-radius:8px;
    display:flex;flex-direction:column;transition:0.2s;}
.calendar-day:hover{border-color:var(--primary);background:var(--bg2);}
.calendar-day.work{background:var(--gradient);color:#fff;border-color:var(--primary);}
.calendar-day.weekend{background:var(--bg2);color:var(--text2);}
.calendar-day .day-num{font-weight:600;}
.calendar-day-header{padding:10px;text-align:center;font-size:10px;background:var(--gradient);
    color:#fff;border-radius:8px;font-weight:600;letter-spacing:1px;}

/* GRADE JOURNAL */
.grade-journal{overflow-x:auto;border-radius:12px;border:1px solid var(--border);}
.grade-journal table{min-width:800px;}
.grade-journal th,.grade-journal td{text-align:center;padding:6px;font-size:12px;min-width:45px;}
.grade-journal td.student-name{text-align:left;min-width:160px;position:sticky;left:0;
    background:var(--card);z-index:1;font-weight:600;}
.grade-journal th.sticky{position:sticky;left:0;background:var(--gradient);color:#fff;z-index:2;}
.grade-cell{cursor:pointer;padding:8px;min-width:35px;font-weight:600;transition:0.2s;}
.grade-cell:hover{background:var(--primary);color:#fff;}

/* CERTIFICATE */
.cert-designer{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.cert-preview{border:8px double var(--primary);padding:40px;text-align:center;
    background:var(--card);min-height:400px;border-radius:12px;}
.cert-preview h1{font-size:28px;font-weight:300;letter-spacing:3px;margin-bottom:10px;}
.cert-preview .child-name{font-size:28px;margin:25px 0;font-weight:300;font-style:italic;}
.cert-preview .cert-points{font-size:24px;margin:20px 0;letter-spacing:2px;}
.color-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:10px 0;}
.color-swatch{aspect-ratio:1;cursor:pointer;border:2px solid var(--border);border-radius:6px;transition:0.2s;}
.color-swatch:hover{transform:scale(1.1);}
.color-swatch.selected{border-color:var(--primary);border-width:3px;}

/* JOURNAL LOG */
.journal-log{max-height:400px;overflow-y:auto;}
.journal-log-item{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12px;
    display:flex;justify-content:space-between;align-items:center;transition:0.2s;}
.journal-log-item:hover{background:var(--bg2);}

/* AVATAR BIG */
.avatar-big{width:120px;height:120px;border-radius:50%;background:var(--gradient);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:48px;
    color:#fff;overflow:hidden;border:4px solid var(--primary);box-shadow:var(--shadow-lg);
    position:relative;cursor:pointer;}
.avatar-big img{width:100%;height:100%;object-fit:cover;}
.avatar-big:hover::after{content:'📷';position:absolute;inset:0;background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;font-size:30px;}

/* HEALTH WARNING */
.health-warning{padding:15px;background:linear-gradient(135deg,rgba(239,68,68,0.1),rgba(220,38,38,0.05));
    border-left:3px solid var(--danger);border-radius:8px;margin:10px 0;}

/* RESPONSIVE */
@media print{.sidebar,.top-bar,.btn,.no-print{display:none!important;}.main{margin:0;padding:0;}}
@media(max-width:768px){.sidebar{position:fixed;left:-280px;height:100%;z-index:100;}.sidebar.open{left:0;}.main{padding:15px;}}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
    <div class="login-box">
        <div class="login-logo">🏕️</div>
        <h2>ЛАСТОЧКА</h2>
        <p class="login-sub">CRM СИСТЕМА УПРАВЛЕНИЯ ЛАГЕРЕ</p>
        <input type="text" id="l_login" placeholder="Логин">
        <input type="password" id="l_pass" placeholder="Пароль">
        <button type="button" id="loginBtn">ВОЙТИ В СИСТЕМУ</button>
        <div class="err" id="l_err"></div>
        <div class="hint">
            <b>Тестовые аккаунты:</b><br>
            👑 Гендир: <code>admin / 1234</code> · 🎖️ Зам: <code>deputy / 1234</code><br>
            🎯 Дир.направления: <code>dir_bask / 1234</code> · ⭐ Вожатый: <code>vozh1 / 1234</code><br>
            ⛑️ Медик: <code>medic / 1234</code> · 💰 Бухгалтер: <code>acc / 1234</code>
        </div>
        <button type="button" class="reset-btn" id="resetBtn">Сбросить все данные</button>
    </div>
</div>

<div id="app" class="app-wrap">
    <aside class="sidebar">
        <div class="sidebar-header">

<script>
'use strict';

const DB_KEY = 'LastochkaPRO_v8_purple';
const CHAT_KEY = 'LastochkaPRO_chat_v8';
const ONLINE_KEY = 'LastochkaPRO_online_v8';
const PRIVATE_CHAT_KEY = 'LastochkaPRO_private_v8';

const ROLES = {

const MENU_LABELS = {
    dashboard:'🏠 Главная',users:'👥 Аккаунты',employees:'💼 Сотрудники',
    children:'👦 Дети',shifts:'📅 Смены',squads:'👥 Отряды',
    directions:'🎯 Направления',myDirection:'🎯 Моё направление',mySquad:'👥 Мой отряд',
    grades:'📚 Журнал оценок',points:'🏆 Баллы',certificates:'📜 Сертификаты',
    finance:'💰 Финансы',budget:'📊 Бюджет',docs:'📂 Документы',
    medical:'⛑️ Медицина',schedule:'🗓️ Расписание',events:'🎉 Мероприятия',
    photos:'📸 Фотогалерея',chat:'💬 Чат',
    inventory:'📦 Инвентарь',quests:'🎮 Квесты',reports:'📈 Отчёты',settings:'⚙️ Настройки',
    workSchedule:'📆 График работы'
};

// ============================================================
// БАЗА ДАННЫХ
// ============================================================
const DB = {
    data: null,
    load() {
        try {
            const raw = localStorage.getItem(DB_KEY);
            if (raw) {
                this.data = JSON.parse(raw);
                const defaults = {
                    users:[],employees:[],children:[],shifts:[],squads:[],
                    directions:{},grades:[],pointsLog:[],achievements:[],
                    finances:[],budget:{categories:{}},
                    docs:{contracts:[],licenses:[],templates:[],personal:[],orders:[]},
                    medical:{cards:[],medicines:[],incidents:[]},
                    schedule:{},events:[],photos:[],chat:[],
                    settings:{theme:'light',campName:'Ласточка'},
                    logs:[],inventory:[],quests:[],
                    certificates:[],workSchedule:{}
                };
                for (const k in defaults) if (!this.data[k]) this.data[k] = defaults[k];
                if (!this.data.users.length) this.initUsers();
            } else this.init();
        } catch (e) { this.init(); }
        return this.data;
    },
    save() {
        try { localStorage.setItem(DB_KEY, JSON.stringify(this.data)); }
        catch(e) { alert('Ошибка сохранения'); }
    },
    init() {
        this.data = {
            users:[],employees:[],children:[],
            shifts:[
                {id:1,name:'1 смена',start:'2026-06-01',end:'2026-06-21',status:'active',workDays:[]},
                {id:2,name:'2 смена',start:'2026-06-25',end:'2026-07-15',status:'planned',workDays:[]},
                {id:3,name:'3 смена',start:'2026-07-20',end:'2026-08-09',status:'planned',workDays:[]}
            ],
            squads:[{id:1,name:'Орлята',shiftId:1,counselorId:8},{id:2,name:'Соколы',shiftId:1,counselorId:9}],
            directions:{
                basketball:{name:'Баскетбол',emoji:'🏀',color:'#e67e22'},
                football:{name:'Футбол',emoji:'⚽',color:'#27ae60'},
                dance:{name:'Танцы',emoji:'💃',color:'#e91e63'},
                singer:{name:'Вокал',emoji:'🎤',color:'#9b59b6'},
                actor:{name:'Актёры',emoji:'🎭',color:'#3498db'}
            },
            grades:[],pointsLog:[],achievements:[],finances:[],budget:{categories:{}},
            docs:{contracts:[],licenses:[],templates:[],personal:[],orders:[]},
            medical:{cards:[],medicines:[],incidents:[]},
            schedule:{},events:[],photos:[],chat:[],
            settings:{theme:'light',campName:'Ласточка'},
            logs:[],inventory:[],quests:[],certificates:[],workSchedule:{}
        };
        this.initUsers();
        this.save();
    },
    initUsers() {
        this.data.users = [
            {id:1,login:'admin',pass:'1234',name:'Иванов Иван Иванович',role:'genDirector',avatar:null},
            {id:2,login:'deputy',pass:'1234',name:'Петров Пётр Петрович',role:'deputyDirector',avatar:null},
            {id:3,login:'dir_bask',pass:'1234',name:'Сидоров С.С.',role:'dirDirector',dept:'basketball',avatar:null},
            {id:4,login:'dir_foot',pass:'1234',name:'Футбов Ф.Ф.',role:'dirDirector',dept:'football',avatar:null},
            {id:5,login:'dir_dance',pass:'1234',name:'Танцева Т.Т.',role:'dirDirector',dept:'dance',avatar:null},
            {id:6,login:'dir_sing',pass:'1234',name:'Певцова П.П.',role:'dirDirector',dept:'singer',avatar:null},
            {id:7,login:'dir_act',pass:'1234',name:'Актерова А.А.',role:'dirDirector',dept:'actor',avatar:null},
            {id:8,login:'vozh1',pass:'1234',name:'Вожатова В.В.',role:'counselor',squad:1,avatar:null},
            {id:9,login:'vozh2',pass:'1234',name:'Вожатый В.В.',role:'counselor',squad:2,avatar:null},
            {id:10,login:'senior',pass:'1234',name:'Старшая С.С.',role:'seniorCounselor',avatar:null},
            {id:11,login:'medic',pass:'1234',name:'Медикова М.М.',role:'medic',avatar:null},
            {id:12,login:'acc',pass:'1234',name:'Бухгалтер Б.Б.',role:'accountant',avatar:null},
            {id:13,login:'sec',pass:'1234',name:'Охранник О.О.',role:'security',avatar:null},
            {id:14,login:'cook',pass:'1234',name:'Повар П.П.',role:'cook',avatar:null},
            {id:15,login:'photo',pass:'1234',name:'Фотограф Ф.Ф.',role:'photographer',avatar:null}
        ];
    },
    log(user, action) {
        try {
            if (!this.data.logs) this.data.logs = [];
            this.data.logs.unshift({date:new Date().toISOString(),user:user||'Система',action:action||''});
            if (this.data.logs.length > 1000) this.data.logs.length = 1000;
        } catch(e) {}
    },
    nextId(arr) {
        if (!arr || !arr.length) return 1;
        return Math.max(...arr.map(x => x.id || 0)) + 1;
    }
};

// ============================================================
// ЧАТ
// ============================================================
const Chat = {
    channel: null, heartbeatInterval: null, unreadCount: 0, lastMessageId: 0,
    currentChatType: 'general', currentPrivatePartner: null,
    init() {
        try {
            this.channel = new BroadcastChannel('lastochka_chat_v8');
            this.channel.onmessage = (e) => this.handleBroadcast(e.data);
        } catch(e) {}
        window.addEventListener('storage', (e) => {
            if (e.key === CHAT_KEY || e.key === PRIVATE_CHAT_KEY) this.handleStorageChange();
            if (e.key === ONLINE_KEY) this.updateOnlineDisplay();
        });
        this.startHeartbeat();
        const msgs = this.getMessages();
        if (msgs.length) this.lastMessageId = msgs[msgs.length - 1].id;
    },
    startHeartbeat() {
        this.updatePresence();
        this.heartbeatInterval = setInterval(() => this.updatePresence(), 5000);
    },
    updatePresence() {
        if (!App.user) return;
        try {
            let online = {};
            const raw = localStorage.getItem(ONLINE_KEY);
            if (raw) online = JSON.parse(raw);
            const now = Date.now();
            Object.keys(online).forEach(uid => { if (now - online[uid].lastSeen > 15000) delete online[uid]; });
            online[App.user.id] = {id:App.user.id,name:App.user.name,role:App.user.role,lastSeen:now};
            localStorage.setItem(ONLINE_KEY, JSON.stringify(online));
            if (this.channel) this.channel.postMessage({type:'presence'});
        } catch(e) {}
    },
    getOnlineUsers() {
        try {
            const raw = localStorage.getItem(ONLINE_KEY);
            if (!raw) return [];
            const online = JSON.parse(raw);
            const now = Date.now();
            return Object.values(online).filter(u => now - u.lastSeen < 15000);
        } catch(e) { return []; }
    },
    getMessages() {
        try {
            if (this.currentChatType === 'general') {
                const raw = localStorage.getItem(CHAT_KEY);
                return raw ? JSON.parse(raw) : [];
            } else {
                const raw = localStorage.getItem(PRIVATE_CHAT_KEY);
                if (!raw) return [];
                const all = JSON.parse(raw);
                const partnerId = this.currentPrivatePartner;
                return all.filter(m => 
                    (m.from === App.user.id && m.to === partnerId) ||
                    (m.from === partnerId && m.to === App.user.id)
                );
            }
        } catch(e) { return []; }
    },
    saveMessages(msgs) {
        if (this.currentChatType === 'general') {
            if (msgs.length > 500) msgs = msgs.slice(-500);
            localStorage.setItem(CHAT_KEY, JSON.stringify(msgs));
        } else {
            const raw = localStorage.getItem(PRIVATE_CHAT_KEY);
            let all = raw ? JSON.parse(raw) : [];
            const partnerId = this.currentPrivatePartner;
            all = all.filter(m => !(
                (m.from === App.user.id && m.to === partnerId) ||
                (m.from === partnerId && m.to === App.user.id)
            ));
            msgs.forEach(m => all.push(m));
            if (all.length > 1000) all = all.slice(-1000);
            localStorage.setItem(PRIVATE_CHAT_KEY, JSON.stringify(all));
        }
    },
    sendMessage(text) {
        if (!text || !text.trim()) return;
        const msg = {
            id: Date.now() + Math.random(),
            from: App.user.id, to: this.currentPrivatePartner || null,
            userId: App.user.id, userName: App.user.name, userRole: App.user.role,
            text: text.trim(), date: new Date().toISOString()
        };
        const msgs = this.getMessages();
        msgs.push(msg);
        this.saveMessages(msgs);
        this.lastMessageId = msg.id;
        if (this.channel) this.channel.postMessage({type:'new_message',message:msg,chatType:this.currentChatType});
        this.renderMessages();
        DB.log(App.user.name, this.currentChatType === 'general' ? 'Сообщение в общий чат' : 'Личное сообщение');
        DB.save();
    },
    handleBroadcast(data) {
        if (data.type === 'new_message') {
            if (data.chatType === this.currentChatType) {
                if (data.message.userId !== App.user.id) this.showNotification(data.message);
                this.renderMessages();
            } else {
                if (data.message.userId !== App.user.id && App.currentPage === 'chat') {
                    this.unreadCount++;
                    this.updateChatBadge();
                }
            }
        }
        if (data.type === 'presence') this.updateOnlineDisplay();
        if (data.type === 'clear') this.renderMessages();
    },
    handleStorageChange() {
        const msgs = this.getMessages();
        const lastMsg = msgs[msgs.length - 1];
        if (lastMsg && lastMsg.id > this.lastMessageId) {
            if (lastMsg.userId !== App.user.id) this.showNotification(lastMsg);
            this.lastMessageId = lastMsg.id;
            this.renderMessages();
        }
    },
    showNotification(msg) {
        const notif = document.getElementById('chatNotification');
        notif.innerHTML = `<b>${msg.userName}:</b> ${msg.text.substring(0, 50)}${msg.text.length > 50 ? '...' : ''}`;
        notif.classList.add('show');
        setTimeout(() => notif.classList.remove('show'), 4000);
        if (App.currentPage !== 'chat') {
            this.unreadCount++;
            this.updateChatBadge();
        }
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`💬 ${msg.userName}`, {body: msg.text.substring(0, 100)});
        }
    },
    updateChatBadge() {
        const chatMenuItem = document.querySelector('.menu-item[data-page="chat"]');
        if (chatMenuItem) {
            const existingBadge = chatMenuItem.querySelector('.menu-badge');
            if (this.unreadCount > 0) {
                if (existingBadge) existingBadge.textContent = this.unreadCount;
                else {
                    const badge = document.createElement('span');
                    badge.className = 'menu-badge';
                    badge.textContent = this.unreadCount;
                    chatMenuItem.appendChild(badge);
                }
            } else if (existingBadge) existingBadge.remove();
        }
    },
    clearUnread() { this.unreadCount = 0; this.updateChatBadge(); },
    switchChat(type, partnerId = null) {
        this.currentChatType = type;
        this.currentPrivatePartner = partnerId;
        const msgs = this.getMessages();
        this.lastMessageId = msgs.length ? msgs[msgs.length - 1].id : 0;
        this.renderMessages();
    },
    renderMessages() {
        const chatBox = document.getElementById('chatBox');
        if (!chatBox) return;
        const msgs = this.getMessages();
        const onlineUsers = this.getOnlineUsers();
        const onlineList = document.getElementById('onlineUsersList');
        if (onlineList) {
            onlineList.innerHTML = onlineUsers.map(u => `<span class="online-user-item"><span class="online-dot"></span>${u.name.split(' ')[0]}</span>`).join('') || '—';
        }
        if (!msgs.length) {
            chatBox.innerHTML = '<p style="text-align:center;color:var(--text2);padding:40px;">Нет сообщений</p>';
            return;
        }
        let html = '';
        let lastDate = '';
        msgs.forEach(m => {
            const msgDate = new Date(m.date).toLocaleDateString('ru-RU');
            if (msgDate !== lastDate) {
                html += `<div style="text-align:center;margin:15px 0;color:var(--text2);font-size:11px;"><b>${msgDate}</b></div>`;
                lastDate = msgDate;
            }
            const isMine = m.userId === App.user.id;
            const time = new Date(m.date).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
            const roleIcon = ROLES[m.userRole]?.icon || '';
            html += `<div class="chat-msg ${isMine ? 'mine' : 'other'}">
                <div class="msg-header"><b>${roleIcon} ${m.userName}</b><span>${time}</span></div>
                <div class="msg-text">${this.escapeHtml(m.text)}</div>
            </div>`;
        });
        chatBox.innerHTML = html;
        chatBox.scrollTop = chatBox.scrollHeight;
    },
    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    },
    clearAll() {
        if (!confirm('Удалить историю чата?')) return;
        this.saveMessages([]);
        this.lastMessageId = 0;
        if (this.channel) this.channel.postMessage({type:'clear'});
        this.renderMessages();
    },
    updateOnlineDisplay() { if (App.currentPage === 'chat') this.renderMessages(); },
    requestNotificationPermission() {
        if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    },
    destroy() {
        if (this.heartbeatInterval) clearInterval(this.heartbeatInterval);
        if (this.channel) this.channel.close();
        try {
            if (App.user) {
                const raw = localStorage.getItem(ONLINE_KEY);
                if (raw) {
                    const online = JSON.parse(raw);
                    delete online[App.user.id];
                    localStorage.setItem(ONLINE_KEY, JSON.stringify(online));
                }
            }
        } catch(e) {}
    }
};

// ============================================================
// APP
// ============================================================
const App = {
    user: null, currentPage: 'dashboard', dirParam: null,
    init() {
        try {
            DB.load();
            const saved = sessionStorage.getItem('currentUser');
            if (saved) {
                try {
                    const u = JSON.parse(saved);
                    const exists = DB.data.users.find(x => x.id === u.id);
                    if (exists) { this.user = exists; this.renderApp(); return; }
                } catch(e) { sessionStorage.removeItem('currentUser'); }
            }
            this.showLogin();
        } catch (e) {
            alert('Ошибка запуска: ' + e.message);
            localStorage.removeItem(DB_KEY);
            location.reload();
        }
    },
    showLogin() {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('app').classList.remove('active');
    },
    auth() {
        try {
            const l = document.getElementById('l_login').value.trim();
            const p = document.getElementById('l_pass').value;
            const errEl = document.getElementById('l_err');
            if (!l || !p) { errEl.textContent = 'Введите логин и пароль'; return; }
            const u = DB.data.users.find(u => u.login === l && u.pass === p);
            if (u) {
                this.user = u;
                sessionStorage.setItem('currentUser', JSON.stringify(u));
                DB.log(u.name, 'Вход в систему');
                DB.save();
                errEl.textContent = '';
                this.renderApp();
            } else errEl.textContent = 'Неверный логин или пароль';
        } catch (e) { document.getElementById('l_err').textContent = 'Ошибка: ' + e.message; }
    },
    logout() {
        try { Chat.destroy(); DB.log(this.user.name, 'Выход'); DB.save(); } catch(e) {}
        sessionStorage.removeItem('currentUser');
        this.user = null;
        location.reload();
    },
    renderApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').classList.add('active');
        document.getElementById('u_name').textContent = this.user.name;
        document.getElementById('u_role').textContent = ROLES[this.user.role].icon + ' ' + ROLES[this.user.role].name;
        document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('ru-RU', {weekday:'long',day:'numeric',month:'long',year:'numeric'});
        this.updateAvatar();
        this.buildMenu();
        Chat.init();
        this.navigate('dashboard');
    },
    updateAvatar() {
        const avatarEl = document.getElementById('userAvatar');
        const avatarText = document.getElementById('userAvatarText');
        if (this.user.avatar) {
            avatarEl.innerHTML = `<img src="${this.user.avatar}" alt="avatar"><div class="avatar-upload" id="avatarUploadBtn">📷</div>`;
        } else {
            const initials = this.user.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            avatarText.textContent = initials;
        }
        document.getElementById('avatarUploadBtn').onclick = (e) => {
            e.stopPropagation();
            this.uploadAvatar();
        };
    },
    uploadAvatar() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                // Сжимаем изображение
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const size = 200;
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    const min = Math.min(img.width, img.height);
                    const sx = (img.width - min) / 2;
                    const sy = (img.height - min) / 2;
                    ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    this.user.avatar = dataUrl;
                    const idx = DB.data.users.findIndex(u => u.id === this.user.id);
                    DB.data.users[idx].avatar = dataUrl;
                    DB.save();
                    this.updateAvatar();
                    UI.toast('Аватар обновлён');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };
        input.click();
    },
    buildMenu() {
        const menu = document.getElementById('navMenu');
        const items = ROLES[this.user.role].menu;
        menu.innerHTML = items.map(k => `<div class="menu-item" data-page="${k}">
            <span class="menu-icon">${MENU_LABELS[k]?.split(' ')[0] || '📋'}</span>
            <span class="menu-label">${MENU_LABELS[k]?.split(' ').slice(1).join(' ') || k}</span>
        </div>`).join('');
        menu.querySelectorAll('.menu-item').forEach(el => {
            el.addEventListener('click', () => {
                if (el.dataset.page === 'chat') Chat.clearUnread();
                this.navigate(el.dataset.page);
            });
        });
    },
    navigate(page) {
        try {
            this.currentPage = page;
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            const active = document.querySelector(`.menu-item[data-page="${page}"]`);
            if (active) active.classList.add('active');
            document.getElementById('pageTitle').textContent = MENU_LABELS[page] || page;
            const fn = Pages[page];
            document.getElementById('pageContent').innerHTML = fn ? fn() : '<div class="card"><h2>Страница не найдена</h2></div>';
            if (page === 'chat') {
                Chat.clearUnread();
                Chat.currentChatType = 'general';
                Chat.currentPrivatePartner = null;
                Chat.renderMessages();
                Chat.requestNotificationPermission();
                setTimeout(() => { const i = document.getElementById('chatInput'); if (i) i.focus(); }, 100);
            }
            if (Pages[page+'_after']) Pages[page+'_after']();
        } catch (e) {
            document.getElementById('pageContent').innerHTML = `<div class="card"><h2>Ошибка: ${e.message}</h2></div>`;
        }
    }
};

// ============================================================
// UI
// ============================================================
const UI = {
    toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    },
    openModal(html) {
        document.getElementById('modalInner').innerHTML = html;
        document.getElementById('modal').classList.add('active');
    },
    closeModal() { document.getElementById('modal').classList.remove('active'); },
    dirBadge(key) {
        const d = DB.data.directions[key];
        if (!d) return key;
        return `<span class="badge badge-filled">${d.emoji} ${d.name}</span>`;
    },
    exportCSV(rows, filename) {
        const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(';')).join('\n');
        const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    },
    exportJSON(data, filename) {
        const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    },
    exportTableToExcel(tableId, filename) {
        const table = document.getElementById(tableId);
        if (!table) return;
        let html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1">';
        table.querySelectorAll('tr').forEach(tr => {
            html += '<tr>';
            tr.querySelectorAll('th,td').forEach(cell => {
                const bg = getComputedStyle(cell).backgroundColor;
                const color = getComputedStyle(cell).color;
                const tag = cell.tagName.toLowerCase();
                html += `<${tag} style="background:${bg};color:${color};padding:5px;">${cell.innerHTML}</${tag}>`;
            });
            html += '</tr>';
        });
        html += '</table></body></html>';
        const blob = new Blob([html], {type:'application/vnd.ms-excel'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    },
    pickUser(options, callback) {
        const users = options.users || DB.data.users;
        const title = options.title || 'Выберите';
        const multiple = options.multiple || false;
        let selected = new Set(options.preselected || []);
        const items = users.map(u => {
            const roleIcon = ROLES[u.role]?.icon || '';
            const isSelected = selected.has(u.id);
            const avatarHtml = u.avatar ? `<img src="${u.avatar}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">` : `<div style="width:40px;height:40px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;">${u.name[0]}</div>`;
            return `<div class="user-picker-item ${isSelected?'selected':''}" data-user-id="${u.id}">
                ${avatarHtml}
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:600;font-size:13px;">${u.name}</div>
                    <div style="font-size:10px;color:var(--text2);">${roleIcon} ${ROLES[u.role]?.name||u.role}</div>
                </div>
            </div>`;
        }).join('');
        UI.openModal(`
            <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">${title}</h2>
            <input type="text" id="userPickerSearch" placeholder="🔍 Поиск...">
            <div class="user-picker">${items}</div>
            <div style="margin-top:15px;display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn" onclick="UI.closeModal()">Отмена</button>
                <button class="btn btn-primary" id="userPickerConfirm">Подтвердить</button>
            </div>
        `);
        document.querySelectorAll('.user-picker-item').forEach(el => {
            el.onclick = () => {
                const id = +el.dataset.userId;
                if (multiple) {
                    if (selected.has(id)) selected.delete(id); else selected.add(id);
                    el.classList.toggle('selected');
                } else {
                    selected = new Set([id]);
                    document.querySelectorAll('.user-picker-item').forEach(e => e.classList.remove('selected'));
                    el.classList.add('selected');
                }
            };
        });
        document.getElementById('userPickerSearch').oninput = (e) => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.user-picker-item').forEach(el => {
                el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        };
        document.getElementById('userPickerConfirm').onclick = () => {
            const result = multiple ? Array.from(selected) : (selected.size ? Array.from(selected)[0] : null);
            UI.closeModal();
            callback(result);
        };
    },
    pickChild(options, callback) {
        const children = options.children || DB.data.children;
        const title = options.title || 'Выберите ребёнка';
        const items = children.map(c => {
            const healthBadge = c.allergy || c.medical ? '<span class="badge badge-health" style="font-size:9px;padding:2px 5px;">⚕</span>' : '';
            return `<div class="user-picker-item" data-child-id="${c.id}">
                <div style="width:40px;height:40px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;">${c.name[0]}</div>
                <div style="flex:1;">
                    <div style="font-weight:600;font-size:13px;">${c.name} ${healthBadge}</div>
                    <div style="font-size:10px;color:var(--text2);">${c.age||''} лет · ${c.parentPhone||''}</div>
                </div>
            </div>`;
        }).join('');
        UI.openModal(`
            <h2 style="margin-bottom:15px;font-weight:300;letter-spacing:1px;font-size:20px;">${title}</h2>
            <input type="text" id="childPickerSearch" placeholder="🔍 Поиск...">
            <div class="user-picker">${items || '<p style="padding:20px;text-align:center;color:var(--text2);">Нет детей</p>'}</div>
            <div style="margin-top:15px;display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn" onclick="UI.closeModal()">Отмена</button>
                <button class="btn btn-primary" id="childPickerConfirm">Подтвердить</button>
            </div>
        `);
        let selected = null;
        document.querySelectorAll('.user-picker-item').forEach(el => {
            el.onclick = () => {
                selected = +el.dataset.childId;
                document.querySelectorAll('.user-picker-item').forEach(e => e.classList.remove('selected'));
                el.classList.add('selected');
            };
        });
        document.getElementById('childPickerSearch').oninput = (e) => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.user-picker-item').forEach(el => {
                el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        };
        document.getElementById('childPickerConfirm').onclick = () => {
            UI.closeModal();
            callback(selected);
        };
    }
};

const Pages = {
    dashboard() {
        const d = DB.data;
        const role = App.user.role;
        let stats = '';
        if (role === 'genDirector' || role === 'deputyDirector') {
            const totalPoints = d.pointsLog.reduce((s,p)=>s+(+p.val||0),0);
            const totalFinance = d.finances.reduce((s,f)=>s+(+f.amount||0),0);
            const onlineUsers = Chat.getOnlineUsers();
            stats = `<div class="grid-stats">
                <div class="stat-card"><div class="stat-icon">👦</div><div class="stat-val">${d.children.length}</div><div class="stat-lbl">Детей</div></div>
                <div class="stat-card"><div class="stat-icon">💼</div><div class="stat-val">${d.employees.length}</div><div class="stat-lbl">Сотрудников</div></div>
                <div class="stat-card"><div class="stat-icon">🏕️</div><div class="stat-val">${d.shifts.length}</div><div class="stat-lbl">Смен</div></div>
                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-val">${d.squads.length}</div><div class="stat-lbl">Отрядов</div></div>
                <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-val">${totalPoints}</div><div class="stat-lbl">Баллов</div></div>
                <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-val">₽${totalFinance.toLocaleString()}</div><div class="stat-lbl">Выручка</div></div>
                <div class="stat-card"><div class="stat-icon">🟢</div><div class="stat-val">${onlineUsers.length}</div><div class="stat-lbl">Онлайн</div></div>
                <div class="stat-card"><div class="stat-icon">💬</div><div class="stat-val">${Chat.getMessages().length}</div><div class="stat-lbl">Сообщений</div></div>
            </div>`;
        } else if (role === 'counselor') {
            const mySquad = d.squads.find(s => s.counselorId === App.user.id);
            const kids = mySquad ? d.children.filter(c => c.squadId === mySquad.id) : [];
            const healthKids = kids.filter(k => k.allergy || k.medical).length;
            stats = `<div class="grid-stats">
                <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-val">${kids.length}</div><div class="stat-lbl">В моём отряде</div></div>
                <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-val">${kids.reduce((s,k)=>s+(k.points||0),0)}</div><div class="stat-lbl">Баллов отряда</div></div>
                ${healthKids > 0 ? `<div class="stat-card" style="border-color:var(--danger);"><div class="stat-icon">⚕️</div><div class="stat-val" style="color:var(--danger);">${healthKids}</div><div class="stat-lbl">С проблемами здоровья</div></div>` : ''}
            </div>
            ${healthKids > 0 ? `<div class="health-warning">
                <b>⚠️ Внимание:</b> ${healthKids} детей с особенностями здоровья. Уточните информацию у медработника.
            </div>` : ''}`;
        } else if (role === 'dirDirector') {
            const kids = d.children.filter(c => c.direction === App.user.dept);
            stats = `<div class="grid-stats">
                <div class="stat-card"><div class="stat-icon">👦</div><div class="stat-val">${kids.length}</div><div class="stat-lbl">Детей направления</div></div>
                <div class="stat-card"><div class="stat-icon">💼</div><div class="stat-val">${d.employees.filter(e=>e.dept===App.user.dept).length}</div><div class="stat-lbl">Сотрудников</div></div>
            </div>`;
        } else {
            stats = `<div class="card"><h3>Добро пожаловать, ${App.user.name}</h3><p style="color:var(--text2);">Роль: ${ROLES[role].icon} ${ROLES[role].name}</p></div>`;
        }
        let journal = '';
        if (role === 'genDirector' || role === 'deputyDirector') {
            journal = `<div class="card"><h3>Последние действия</h3>
                <div class="journal-log">
                    ${(d.logs||[]).slice(0,15).map(l => 
                        `<div class="journal-log-item">
                            <span><b>${l.user}</b>: ${l.action}</span>
                            <span style="color:var(--text2);font-size:11px;">${new Date(l.date).toLocaleString('ru-RU')}</span>
                        </div>`
                    ).join('') || '<p style="color:var(--text2);">Нет действий</p>'}
                </div>
            </div>`;
        }
        return stats + journal;
    },

    users() {
        if (App.user.role !== 'genDirector') return '<div class="card">Доступ только у гендиректора</div>';
        const rows = DB.data.users.map(u => {
            const avatarHtml = u.avatar ? `<img src="${u.avatar}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">` : `<div style="width:32px;height:32px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;">${u.name[0]}</div>`;
            return `<tr>
                <td style="display:flex;align-items:center;gap:10px;">${avatarHtml}<b>${u.login}</b></td>
                <td>${u.name}</td>
                <td>${ROLES[u.role]?.icon||''} ${ROLES[u.role]?.name||u.role}</td>
                <td>${u.dept?UI.dirBadge(u.dept):''} ${u.squad?'Отряд '+u.squad:''}</td>
                <td>${u.id!==1?`<button class="btn btn-sm btn-danger" data-del-user="${u.id}">Удалить</button>`:'<span class="badge badge-filled">Владелец</span>'}</td>
            </tr>`;
        }).join('');
        return `<div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;align-items:center;">
                <h3>Управление аккаунтами</h3>
                <button class="btn btn-primary" id="addUserBtn">➕ Создать</button>
            </div>
            <table><thead><tr><th>Логин</th><th>ФИО</th><th>Роль</th><th>Привязка</th><th>Действия</th></tr></thead>
            <tbody>${rows}</tbody></table>
        </div>`;
    },

    employees() {
        let emps = DB.data.employees;
        if (App.user.role === 'dirDirector') emps = emps.filter(e => e.dept === App.user.dept);
        const rows = emps.map(e => {
            const level = (e.xp||0) < 25 ? 'Стажёр' : (e.xp||0) < 50 ? 'Специалист' : (e.xp||0) < 75 ? 'Старший спец.' : 'Руководитель';

                    </div>
                    <small>${level} (${e.xp||0}/100)</small>

                    <button class="btn btn-sm" data-link-emp="${e.id}" title="Привязать аккаунт">🔗</button>
                    <button class="btn btn-sm" data-edit-emp="${e.id}">✏️</button>
                    <button class="btn btn-sm btn-danger" data-del-emp="${e.id}">✕</button>
                </td>
            </tr>`;
        }).join('');
        return `<div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
                <h3>Сотрудники</h3>
                <div>
                    <button class="btn" id="exportEmpBtn">📥 Excel</button>
                    <button class="btn btn-primary" id="addEmpBtn">➕ Добавить</button>
                </div>
            </div>
            <table><thead><tr><th>ФИО</th><th>Должность</th><th>Направление</th><th>Телефон</th><th>Аккаунт</th><th>Прогресс</th><th>Действия</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="7" style="text-align:center;color:var(--text2);">Нет сотрудников</td></tr>'}</tbody></table>
        </div>`;
    },

    children() {
        let kids = DB.data.children;
        if (App.user.role === 'dirDirector') kids = kids.filter(c => c.direction === App.user.dept);
        if (App.user.role === 'counselor') kids = kids.filter(c => c.squadId === App.user.squad);
        const rows = kids.map(c => {
            const healthBadge = c.allergy || c.medical ? '<span class="badge badge-health" title="Есть проблемы со здоровьем">⚕</span>' : '';
            return `<tr>
                <td><b>${c.name}</b> ${healthBadge}</td><td>${c.age||''}</td>
                <td>${c.parentName||''}</td><td>${c.parentPhone||''}</td>
                <td>${c.direction?UI.dirBadge(c.direction):''}</td>
                <td>${c.squadId?(DB.data.squads.find(s=>s.id===c.squadId)?.name||''):'—'}</td>
                <td>⭐ ${c.points||0}</td>
                <td>
                    <button class="btn btn-sm" data-view-child="${c.id}">👁️</button>
                    <button class="btn btn-sm" data-edit-child="${c.id}">✏️</button>
                    <button class="btn btn-sm btn-danger" data-del-child="${c.id}">✕</button>
                </td>
            </tr>`;
        }).join('');
        return `<div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;flex-wrap:wrap;gap:10px;">
                <h3>Дети</h3>
                <div>
                    <button class="btn" id="exportChildBtn">📥 Excel</button>
                    <button class="btn btn-primary" id="addChildBtn">➕ Добавить</button>
                </div>
            </div>
            <table><thead><tr><th>ФИО</th><th>Возраст</th><th>Родитель</th><th>Телефон</th><th>Направление</th><th>Отряд</th><th>Баллы</th><th>Действия</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="8" style="text-align:center;color:var(--text2);">Нет детей</td></tr>'}</tbody></table>
        </div>`;
    },

    shifts() {
        const rows = DB.data.shifts.map(s => {
            const kids = DB.data.children.filter(c => c.shiftId === s.id && c.onShift);
            const statusText = s.status==='active'?'Активна':s.status==='planned'?'Планируется':'Завершена';
            const workDaysCount = (s.workDays||[]).length;
            return `<tr>
                <td><b>${s.name}</b></td><td>${s.start}</td><td>${s.end}</td>
                <td><span class="badge badge-filled">${statusText}</span></td>
                <td>${kids.length}</td>
                <td>${workDaysCount} раб. дней</td>
                <td>
                    <button class="btn btn-sm btn-primary" data-shift-calendar="${s.id}">📅 Календарь</button>
                    <button class="btn btn-sm" data-edit-shift="${s.id}">✏️</button>
                    <button class="btn btn-sm btn-danger" data-del-shift="${s.id}">✕</button>
                </td>
            </tr>`;
        }).join('');
        return `<div class="card">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
                <h3>Смены лагеря</h3>
                <button class="btn btn-primary" id="addShiftBtn">➕ Добавить смену</button>
            </div>
            <table><thead><tr><th>Название</th><th>Начало</th><th>Конец</th><th>Статус</th><th>Детей</th><th>Рабочие дни</th><th>Действия</th></tr></thead>
            <tbody>${rows}</tbody></table>
        </div>`;

    squads() {
        const rows = DB.data.squads.map(sq => {
            const kids = DB.data.children.filter(c => c.squadId === sq.id);
            const counselor = DB.data.users.find(u => u.id === sq.counselorId);
            return `<tr>
                <td><b>${sq.name}</b></td>
                <td>${DB.data.shifts.find(s=>s.id===sq.shiftId)?.name||'—'}</td>

                <td>${kids.length}</td>
                <td>⭐ ${kids.reduce((s,k)=>s+(k.points||0),0)}</td>

    directions() {
        const cards = Object.keys(DB.data.directions).map(k => {
            const d = DB.data.directions[k];
            const kids = DB.data.children.filter(c => c.direction === k);
            const emps = DB.data.employees.filter(e => e.dept === k);
            const dirUser = DB.data.users.find(u => u.role === 'dirDirector' && u.dept === k);
            return `<div class="card" style="border-left:4px solid ${d.color};">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h3>${d.emoji} ${d.name}</h3>
                    <button class="btn btn-sm btn-primary" data-dir-detail="${k}">Подробнее →</button>
                </div>
                <p style="font-size:12px;color:var(--text2);">Директор: <b>${dirUser?.name||'Не назначен'}</b></p>
                <p style="font-size:12px;color:var(--text2);">Сотрудников: ${emps.length} · Детей: ${kids.length}</p>
            </div>`;
        }).join('');
        return `<div class="card"><h3>Направления лагеря</h3>${cards}</div>`;
    },

    myDirection() { App.dirParam = App.user.dept; return Pages.direction_detail(); },

    direction_detail() {
        const k = App.dirParam || Object.keys(DB.data.directions)[0];
        const d = DB.data.directions[k];
        const kids = DB.data.children.filter(c => c.direction === k);
        const emps = DB.data.employees.filter(e => e.dept === k);
        const dirUser = DB.data.users.find(u => u.role === 'dirDirector' && u.dept === k);
        const kidsRows = kids.map(c => `<tr><td>${c.name}</td><td>${c.age||''}</td><td>${c.squadId?DB.data.squads.find(s=>s.id===c.squadId)?.name||'—':'—'}</td><td>⭐ ${c.points||0}</td></tr>`).join('');
        const empsRows = emps.map(e => `<tr><td>${e.name}</td><td>${e.position}</td><td>${e.phone||''}</td></tr>`).join('');
        return `<div class="card" style="border-left:4px solid ${d.color};">
            <h3>${d.emoji} Направление: ${d.name}</h3>
            <p style="color:var(--text2);">Директор: <b>${dirUser?.name||'Не назначен'}</b></p>

    budget_after() {
        const cats = DB.data.budget.categories || {};
        const keys = Object.keys(cats);
        if (!keys.length) return;
        const canvas = document.getElementById('budgetChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0,0,w,h);
        const maxVal = Math.max(...keys.map(k => Math.max(cats[k].planned||0, cats[k].fact||0)), 1);
        const barWidth = (w - 40) / keys.length / 2 - 5;
        keys.forEach((k, i) => {
            const x = 40 + i * ((w - 40) / keys.length);
            const plannedH = ((cats[k].planned||0) / maxVal) * (h - 40);
            const factH = ((cats[k].fact||0) / maxVal) * (h - 40);
            const grad1 = ctx.createLinearGradient(0, h-20-plannedH, 0, h-20);
            grad1.addColorStop(0, '#a78bfa');
            grad1.addColorStop(1, '#6d28d9');
            ctx.fillStyle = grad1;
            ctx.fillRect(x, h - 20 - plannedH, barWidth, plannedH);
            const grad2 = ctx.createLinearGradient(0, h-20-factH, 0, h-20);
            grad2.addColorStop(0, '#8b5cf6');
            grad2.addColorStop(1, '#4c1d95');
            ctx.fillStyle = grad2;
            ctx.fillRect(x + barWidth + 2, h - 20 - factH, barWidth, factH);
            ctx.fillStyle = '#e5e7eb';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(k.substring(0, 10), x + barWidth, h - 5);
        });
    },
